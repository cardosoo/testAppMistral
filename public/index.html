<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Mistral</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f4f4f5;
      color: #18181b;
      display: flex;
      justify-content: center;
    }
    main {
      width: 100%;
      max-width: 720px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1rem;
      gap: 0.75rem;
    }
    h1 { font-size: 1.25rem; margin: 0.5rem 0 0; }
    #messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 0.5rem;
      background: #fff;
      border: 1px solid #e4e4e7;
      border-radius: 0.75rem;
    }
    .msg {
      max-width: 80%;
      padding: 0.6rem 0.9rem;
      border-radius: 0.9rem;
      white-space: pre-wrap;
      line-height: 1.4;
    }
    .msg.user {
      align-self: flex-end;
      background: #ffd400;
      border-bottom-right-radius: 0.2rem;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #e4e4e7;
      border-bottom-left-radius: 0.2rem;
    }
    .msg.error {
      align-self: center;
      background: #fee2e2;
      color: #b91c1c;
    }
    form { display: flex; gap: 0.5rem; }
    #input {
      flex: 1;
      padding: 0.7rem 0.9rem;
      border: 1px solid #d4d4d8;
      border-radius: 0.75rem;
      font-size: 1rem;
    }
    button {
      padding: 0.7rem 1.2rem;
      border: none;
      border-radius: 0.75rem;
      background: #18181b;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <main>
    <h1>Chat Mistral (mistral-small-latest)</h1>
    <div id="messages"></div>
    <form id="form">
      <input id="input" type="text" placeholder="Écrivez votre message…" autocomplete="off" required />
      <button id="send" type="submit">Envoyer</button>
    </form>
  </main>
  <script>
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const history = [];

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      sendBtn.disabled = true;

      history.push({ role: "user", content: text });
      addMessage("user", text);
      const pending = addMessage("assistant", "…");

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Erreur serveur");
        pending.textContent = data.reply;
        history.push({ role: "assistant", content: data.reply });
      } catch (err) {
        pending.className = "msg error";
        pending.textContent = err.message;
        history.pop();
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
